# BizLens — nginx on an unused loopback port (same pattern as other g1orga apps).
# Cloudflare Tunnel points here; nginx proxies to gunicorn.
#
# Install:
#   sudo cp deploy/nginx-bizlens.conf /etc/nginx/sites-available/bizlens
#   sudo ln -sf /etc/nginx/sites-available/bizlens /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream bizlens_app {
    server 127.0.0.1:8020;
    keepalive 32;
}

server {
    listen 127.0.0.1:8088;
    server_name bizlens.g1orga.dev;

    client_max_body_size 16M;

    # Prophet / Lens OCR can be slow
    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://bizlens_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
