# BizLens — nginx reverse proxy on an unused local port
# Default: 127.0.0.1:8088 → gunicorn 127.0.0.1:8000
# Cloudflare Tunnel should point to: http://127.0.0.1:8088
#
# Install:
#   sudo cp deploy/ubuntu/nginx-bizlens.conf /etc/nginx/sites-available/bizlens
#   sudo ln -sf /etc/nginx/sites-available/bizlens /etc/nginx/sites-enabled/bizlens
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8088;
    server_name bizlens.g1orga.dev;

    client_max_body_size 16M;

    # Longer timeouts for Prophet / Lens OCR
    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
