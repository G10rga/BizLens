# cloudflared → nginx unused port → gunicorn
# Hostname: bizlens.g1orga.dev
# nginx listens on 127.0.0.1:8088 (see nginx-bizlens.conf)

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: bizlens.g1orga.dev
    service: http://127.0.0.1:8088
  - service: http_status:404
